<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java工程师面试复习资料</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-dark: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --accent: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        /* 左侧导航 */
        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width 0.3s ease, transform 0.3s ease;
            overflow: hidden;
        }

        .sidebar.collapsed {
            width: 0;
        }

        .sidebar.collapsed .sidebar-header,
        .sidebar.collapsed .search-box,
        .sidebar.collapsed .nav-list {
            opacity: 0;
            pointer-events: none;
        }

        /* 移动端 hamburger */
        .hamburger {
            display: none;
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 1001;
            width: 40px;
            height: 40px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .hamburger:hover {
            background: var(--primary);
        }

        /* 移动端遮罩层 */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* 侧边栏折叠按钮 */
        .sidebar-toggle {
            position: absolute;
            top: 50%;
            right: -14px;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
            z-index: 10;
        }

        .sidebar-toggle:hover {
            background: var(--primary);
            color: white;
        }

        .sidebar.collapsed .sidebar-toggle i {
            transform: rotate(180deg);
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .sidebar-header h1 {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .sidebar-header p {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 5px;
        }
        
        .nav-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .nav-item {
            margin-bottom: 4px;
        }
        
        .nav-item-btn {
            width: 100%;
            padding: 12px 16px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }
        
        .nav-item-btn:hover {
            background: rgba(59, 130, 246, 0.1);
            color: var(--text-primary);
        }
        
        .nav-item-btn.active {
            background: var(--primary);
            color: white;
        }
        
        .nav-item-btn i {
            width: 20px;
            text-align: center;
        }
        
        .nav-item-btn .count {
            margin-left: auto;
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
        }
        
        /* 右侧内容 */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .toolbar {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-sidebar);
        }
        
        .toolbar h2 {
            font-size: 20px;
            font-weight: 600;
        }
        
        .toolbar-actions {
            display: flex;
            gap: 10px;
        }
        
        .toolbar-actions button {
            padding: 8px 16px;
            background: var(--primary);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        
        .toolbar-actions button:hover {
            background: var(--primary-dark);
        }
        
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        
        .topic-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .topic-header {
            padding: 16px 20px;
            background: rgba(59, 130, 246, 0.05);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .topic-header i {
            color: var(--accent);
            font-size: 18px;
        }
        
        .topic-header h3 {
            font-size: 16px;
            font-weight: 600;
        }
        
        .topic-content {
            padding: 20px;
        }
        
        .knowledge-point {
            margin-bottom: 20px;
        }
        
        .knowledge-point:last-child {
            margin-bottom: 0;
        }
        
        .knowledge-point h4 {
            font-size: 15px;
            font-weight: 600;
            color: var(--success);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .knowledge-point h4::before {
            content: "▎";
            color: var(--accent);
        }
        
        .knowledge-point p {
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-secondary);
            padding-left: 16px;
        }
        
        .code-block {
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin: 12px 0;
            overflow-x: auto;
        }
        
        .code-block code {
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            color: #e6edf3;
            line-height: 1.6;
        }
        
        .highlight-box {
            background: rgba(16, 185, 129, 0.1);
            border-left: 3px solid var(--success);
            padding: 12px 16px;
            margin: 12px 0;
            border-radius: 0 8px 8px 0;
        }
        
        .warning-box {
            background: rgba(245, 158, 11, 0.1);
            border-left: 3px solid var(--warning);
            padding: 12px 16px;
            margin: 12px 0;
            border-radius: 0 8px 8px 0;
        }
        
        .tag {
            display: inline-block;
            padding: 3px 10px;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 4px;
            font-size: 11px;
            color: var(--accent);
            margin-right: 6px;
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
        }
        
        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        
        .search-box {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .search-box input {
            width: 100%;
            padding: 10px 16px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
        }
        
        .search-box input::placeholder {
            color: var(--text-secondary);
        }
        
        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
        
        .stats-bar {
            display: flex;
            gap: 20px;
            padding: 12px 20px;
            background: rgba(59, 130, 246, 0.05);
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .stats-bar span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .stats-bar i {
            color: var(--accent);
        }

        /* ============================================
           移动端响应式
           ============================================ */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                overflow: auto;
            }

            .hamburger {
                display: flex;
            }

            /* 移动端：侧边栏默认隐藏，overlay控制 */
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                z-index: 1000;
                width: 280px;
                transform: translateX(-100%);
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.3);
            }

            .sidebar.mobile-open {
                transform: translateX(0);
                width: 280px;
            }

            .sidebar.collapsed {
                width: 280px; /* 移动端忽略PC折叠逻辑 */
                transform: translateX(-100%);
            }

            .sidebar.collapsed .sidebar-toggle {
                right: -36px;
            }

            .sidebar.mobile-open.collapsed {
                transform: translateX(-100%);
            }

            .sidebar-toggle {
                display: none; /* 移动端用hamburger */
            }

            .sidebar-overlay.active {
                display: block;
            }

            /* 主内容区移动端padding */
            .main {
                width: 100%;
                min-height: 100vh;
            }

            .toolbar {
                padding-left: 60px; /* 给hamburger留位 */
                padding-right: 16px;
            }

            .content-area {
                padding: 16px;
            }

            /* 移动端工具栏按钮缩小 */
            .toolbar-actions button {
                padding: 6px 10px;
                font-size: 12px;
            }

            .toolbar-actions button i {
                display: none;
            }

            .stats-bar {
                flex-wrap: wrap;
                gap: 8px;
                padding: 10px 16px;
            }

            .topic-header {
                padding: 12px 16px;
            }

            .topic-content {
                padding: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- 移动端 hamburger -->
    <button class="hamburger" id="hamburger" onclick="toggleMobileMenu()">
        <i class="fas fa-bars"></i>
    </button>

    <!-- 移动端遮罩层 -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMobileMenu()"></div>

    <!-- 左侧导航 -->
    <nav class="sidebar" id="sidebar">
        <!-- PC端折叠按钮 -->
        <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" title="收起/展开导航">
            <i class="fas fa-chevron-left"></i>
        </button>

        <div class="sidebar-header">
            <h1><i class="fas fa-code"></i> Java面试通</h1>
            <p>13年经验工程师面试复习资料</p>
        </div>
        <div class="search-box">
            <input type="text" placeholder="搜索知识点..." id="searchInput" onkeyup="filterContent()">
        </div>
        <div class="nav-list" id="navList">
            <!-- Nav items will be rendered by JS -->
        </div>
    </nav>
    
    <!-- 右侧内容 -->
    <main class="main">
        <div class="toolbar">
            <h2 id="currentTitle">请选择知识点分类</h2>
            <div class="toolbar-actions">
                <button onclick="expandAll()"><i class="fas fa-plus"></i> 展开全部</button>
                <button onclick="collapseAll()"><i class="fas fa-minus"></i> 收起全部</button>
            </div>
        </div>
        <div class="stats-bar">
            <span><i class="fas fa-layer-group"></i> 8个知识模块</span>
            <span><i class="fas fa-file-alt"></i> 40+面试知识点</span>
            <span><i class="fas fa-clock"></i> 预计复习时间 20小时</span>
        </div>
        <div class="content-area" id="contentArea">
            <div class="empty-state">
                <i class="fas fa-book-reader"></i>
                <p>从左侧导航选择知识点分类开始复习</p>
            </div>
        </div>
    </main>

    <script>
        // ============================================
        // 侧边栏折叠 + 移动端菜单
        // ============================================
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const hamburger = document.getElementById('hamburger');
        const overlay = document.getElementById('sidebarOverlay');

        // 读取折叠状态（刷新后记住）
        const savedCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
        if (savedCollapsed) sidebar.classList.add('collapsed');

        // PC端：点击右侧箭头折叠/展开
        function toggleSidebar() {
            sidebar.classList.toggle('collapsed');
            localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
        }

        // 移动端：hamburger切换
        function toggleMobileMenu() {
            const isOpen = sidebar.classList.contains('mobile-open');
            if (isOpen) {
                sidebar.classList.remove('mobile-open');
                overlay.classList.remove('active');
                hamburger.querySelector('i').className = 'fas fa-bars';
            } else {
                sidebar.classList.add('mobile-open');
                // 移动端也移除PC折叠状态
                sidebar.classList.remove('collapsed');
                overlay.classList.add('active');
                hamburger.querySelector('i').className = 'fas fa-times';
            }
        }

        // 知识库数据
        const knowledgeBase = {
            "java-core": {
                title: "Java核心基础",
                icon: "fab fa-java",
                topics: [
                    {
                        title: "JVM内存模型",
                        points: [
                            {
                                subtitle: "JVM内存区域划分",
                                content: `<p><strong>堆（Heap）</strong>：存放对象实例，是GC的主要管理区域，分为年轻代（Eden、Survivor）和老年代</p>
                                <p><strong>方法区（Method Area）</strong>：存储类信息、常量、静态变量、 JIT编译后的代码</p>
                                <p><strong>虚拟机栈（VM Stack）</strong>：每个线程独有，存储局部变量表、操作数栈、动态链接、方法出口</p>
                                <p><strong>本地方法栈（Native Method Stack）</strong>：为Native方法服务</p>
                                <p><strong>程序计数器（Program Counter Register）</strong>：当前线程执行的字节码行号指示器</p>`
                            },
                            {
                                subtitle: "常见面试题",
                                content: `<div class="highlight-box">
                                <p><strong>Q: 对象在堆中的生命周期？</strong></p>
                                <p>对象优先在Eden区分配，当Eden满时触发Minor GC。存活的对象移动到Survivor区，经过15次GC后仍存活则进入老年代。大对象直接进入老年代。</p>
                                </div>
                                <div class="warning-box">
                                <p><strong>注意</strong>：JDK8后永久代被元空间替代，元空间使用直接内存，避免了OOM问题</p>
                                </div>`
                            },
                            {
                                subtitle: "相关配置参数",
                                content: `<div class="code-block"><code>-Xms256m -Xmx256m    // 堆最小最大设置
-Xmn128m              // 年轻代大小
-XX:MetaspaceSize=128m // 元空间大小
-XX:+PrintGCDetails    // 打印GC详情</code></div>`
                            }
                        ]
                    },
                    {
                        title: "垃圾回收机制",
                        points: [
                            {
                                subtitle: "垃圾回收算法",
                                content: `<p><strong>标记-清除（Mark-Sweep）</strong>：效率不高，会产生内存碎片</p>
                                <p><strong>复制算法（Copying）</strong>：适用于年轻代，将内存分为两块，效率高但空间利用率低</p>
                                <p><strong>标记-整理（Mark-Compact）</strong>：适用于老年代，标记后整理成连续空间</p>
                                <p><strong>分代收集（Generational Collection）</strong>：结合以上算法，年轻代用复制，老年代用标记-整理</p>`
                            },
                            {
                                subtitle: "垃圾收集器",
                                content: `<p><strong>年轻代</strong>：Serial（单线程）、ParNew（多线程）、Parallel Scavenge（吞吐量优先）</p>
                                <p><strong>老年代</strong>：Serial Old、CMS（并发标记清除）、Parallel Old</p>
                                <p><strong>G1（Garbage First）</strong>：将堆划分为多个Region，可预测停顿时间，支持并发并行</p>
                                <p><strong>ZGC/Shenandoah</strong>：低延迟GC，停顿时间控制在毫秒级</p>`
                            },
                            {
                                subtitle: "CMS收集器工作流程",
                                content: `<div class="code-block"><code>1. 初始标记（STW）：标记GC Roots直接引用的对象
2. 并发标记：遍历对象图，可与用户线程并发执行
3. 重新标记（STW）：修正并发标记期间产生的变动
4. 并发清除：清理死亡对象，可与用户线程并发执行</code></div>
                                <div class="highlight-box">
                                <p><strong>CMS优缺点</strong>：并发收集、低停顿，但会产生浮动垃圾和内存碎片，对CPU敏感</p>
                                </div>`
                            }
                        ]
                    },
                    {
                        title: "类加载机制",
                        points: [
                            {
                                subtitle: "类加载过程",
                                content: `<p><strong>加载（Loading）</strong>：通过类的全限定名获取类的二进制字节流，在堆中生成Class对象</p>
                                <p><strong>验证（Verification）</strong>：确保字节流符合虚拟机要求</p>
                                <p><strong>准备（Preparation）</strong>：为静态变量分配内存并设置初始值</p>
                                <p><strong>解析（Resolution）</strong>：将符号引用转换为直接引用</p>
                                <p><strong>初始化（Initialization）</strong>：执行类构造器<clinit>()，为类变量赋实际值</p>`
                            },
                            {
                                subtitle: "双亲委派模型",
                                content: `<div class="code-block"><code>ClassLoader
    ├── BootstrapClassLoader（C++实现，加载核心类库）
    ├── ExtClassLoader（扩展类加载器）
    └── AppClassLoader（应用类加载器）</code></div>
                                <p><strong>工作原理</strong>：类加载时先请求父类加载器处理，父类无法处理才自己加载</p>
                                <div class="highlight-box">
                                <p><strong>优势</strong>：避免类的重复加载，防止核心API被篡改，保证安全性</p>
                                </div>`
                            },
                            {
                                subtitle: "常见面试题",
                                content: `<div class="highlight-box">
                                <p><strong>Q: 如何打破双亲委派？</strong></p>
                                <p>重写ClassLoader的loadClass()方法，或使用线程上下文加载器（Thread Context ClassLoader）</p>
                                </div>
                                <div class="highlight-box">
                                <p><strong>Q: Tomcat如何实现？</strong></p>
                                <p>每个WebApp有自己的WebAppClassLoader，加载顺序：BootstrapClassLoader → ExtClassLoader → AppClassLoader → WebAppClassLoader</p>
                                </div>`
                            }
                        ]
                    },
                    {
                        title: "多线程与并发",
                        points: [
                            {
                                subtitle: "线程生命周期",
                                content: `<p><strong>NEW → RUNNABLE → BLOCKED/WAITING → TERMINATED</strong></p>
                                <p>RUNNABLE包括Ready和Running两个状态，调用start()后进入Ready，等CPU调度后进入Running</p>
                                <p>阻塞状态：BLOCKED（等锁）、WAITING（wait/join/park）、TIMED_WAITING（sleep/yait with timeout）</p>`
                            },
                            {
                                subtitle: "synchronized关键字",
                                content: `<p><strong>作用</strong>：保证原子性、可见性、有序性</p>
                                <p><strong>锁升级</strong>：无锁 → 偏向锁 → 轻量级锁 → 重量级锁（不可逆）</p>
                                <p><strong>实现原理</strong>：对象头部的Mark Word存储锁信息，偏向锁记录线程ID，轻量级锁使用CAS+自旋</p>
                                <div class="code-block"><code>// 修饰实例方法 - 锁对象
public synchronized void method() {}

// 修饰静态方法 - 锁Class对象
public static synchronized void staticMethod() {}

// 修饰代码块 - 锁指定对象
synchronized (this) {}</code></div>`
                            },
                            {
                                subtitle: "volatile关键字",

        if (instance == null) {              // 第一次检查

                if (instance == null) {      // 第二次检查（双重检查）

        // 当前选中的分类
        let currentCategory = null;

        // 渲染导航
        function renderNav() {
            const navList = document.getElementById('navList');
            navList.innerHTML = Object.entries(knowledgeBase).map(([id, data]) => `
                <div class="nav-item">
                    <button class="nav-item-btn" onclick="showCategory('${id}')" id="nav-${id}">
                        <i class="${data.icon}"></i>
                        <span>${data.title}</span>
                        <span class="count">${data.topics.length}</span>
                    </button>
                </div>
            `).join('');
        }

        // 显示分类内容
        function showCategory(id) {
            // 更新导航高亮
            document.querySelectorAll('.nav-item-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('nav-' + id).classList.add('active');

            currentCategory = id;
            const category = knowledgeBase[id];
            document.getElementById('currentTitle').textContent = category.title;

            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = category.topics.map(topic => `
                <div class="topic-card">
                    <div class="topic-header">
                        <i class="${category.icon}"></i>
                        <h3>${topic.title}</h3>
                    </div>
                    <div class="topic-content">
                        ${topic.points.map(point => `
                            <div class="knowledge-point">
                                <h4>${point.subtitle}</h4>
                                ${point.content}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            // 移动端：选中分类后自动关闭侧边栏
            if (window.innerWidth <= 768) {
                sidebar.classList.remove('mobile-open');
                overlay.classList.remove('active');
                hamburger.querySelector('i').className = 'fas fa-bars';
            }
        }

        // 展开全部
        function expandAll() {
            document.querySelectorAll('.topic-card').forEach(card => {
                card.style.display = 'block';
            });
        }

        // 收起全部
        function collapseAll() {
            // 收起功能可以根据需要实现
        }

        // 搜索过滤
        function filterContent() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (!query) {
                if (currentCategory) showCategory(currentCategory);
                return;
            }
            
            // 搜索所有分类
            const results = [];
            Object.entries(knowledgeBase).forEach(([catId, cat]) => {
                cat.topics.forEach(topic => {
                    const text = JSON.stringify(topic).toLowerCase();
                    if (text.includes(query)) {
                        results.push({ catId, cat, topic });
                    }
                });
            });
            
            if (results.length === 0) {
                document.getElementById('contentArea').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <p>未找到"${query}"相关知识点</p>
                    </div>
                `;
                return;
            }
            
            document.getElementById('currentTitle').textContent = `搜索结果: "${query}"`;
            document.getElementById('contentArea').innerHTML = results.map(r => `
                <div class="topic-card">
                    <div class="topic-header">
                        <i class="${r.cat.icon}"></i>
                        <h3>[${r.cat.title}] ${r.topic.title}</h3>
                    </div>
                    <div class="topic-content">
                        ${r.topic.points.map(point => `
                            <div class="knowledge-point">
                                <h4>${point.subtitle}</h4>
                                ${point.content}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        // 初始化
        renderNav();
    </script>
